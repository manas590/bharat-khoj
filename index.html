<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat - Desi Google</title>
<style>
body{font-family:Arial;margin:0;padding:15px;background:#fff;text-align:center}
.logo{font-size:55px;font-weight:900}
.logo span:nth-child(1){color:#4285F4}.logo span:nth-child(2){color:#EA4335}
.logo span:nth-child(3){color:#FBBC05}.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#34A853}.logo span:nth-child(6){color:#EA4335}
.search-box{display:flex;align-items:center;border:1px solid #ddd;border-radius:30px;padding:8px 10px}
.search-box input{flex:1;border:none;outline:none;font-size:17px;padding:8px}
.btn-row{display:flex;gap:10px;justify-content:center;margin:10px 0}
.big-btn{flex:1;padding:13px;border:none;border-radius:25px;color:#fff;font-size:16px;font-weight:bold}
.blue{background:#4285F4}.orange{background:#ff6600}
.chip{border:none;padding:8px 12px;border-radius:20px;font-weight:bold;margin:3px}
#answer{display:none;background:#fff8e1;border:1px solid #ffd658;padding:15px;border-radius:12px;margin-top:15px;text-align:left;font-size:16px}
</style>
</head>
<body>

<div class="logo"><span>B</span><span>h</span><span>a</span><span>r</span><span>a</span><span>t</span></div>
<p>Desi Google - Roz 1500 Naye Question Save Hoga</p>

<div class="search-box">
<input id="q" type="text" placeholder="Yahan likho ya bolo...">
<button id="micBtn">🎤</button>
</div>

<div class="btn-row">
<button class="big-btn blue" id="khojBtn">Khoj Karo 🔍</button>
<button class="big-btn orange" id="aiBtn">AI Se Pucho ✨</button>
</div>

<div>
<button class="chip" style="background:#ff6f00" data-s="Mausam">☀️ Mausam</button>
<button class="chip" style="background:#1a73e8;color:#fff" data-s="News">📰 News</button>
<button class="chip" style="background:#0d9d4a;color:#fff" data-s="Krishi">🌾 Krishi</button>
<button class="chip" style="background:#d32f2f;color:#fff" data-s="Cricket">🏏 Cricket</button>
<button class="chip" style="background:#7c4dff;color:#fff" data-s="Naukri">💼 Naukri</button>
<button class="chip" style="background:#ff8f00" data-s="Train">🚆 Train</button>
<button class="chip" style="background:#e6e6e6" data-s="Mandi">🧺 Mandi</button>
<button class="chip" style="background:#4caf50;color:#fff" data-s="Bihar Sarkar">🏛️ Bihar Sarkar</button>
<button class="chip" style="background:#ffcc00" data-s="Sona Bhav">🪙 Sona Bhav</button>
</div>

<div id="answer"></div>

<script>
let qInput = document.getElementById('q');
let ansBox = document.getElementById('answer');

async function aiSePucho(question){
  ansBox.style.display="block";
  ansBox.innerHTML="AI soch raha hai... ⏳";
  try{
    let url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY;
    let res = await fetch(url, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents: [{ parts: [{ text: "Hindi me aasan bhasha me jawab do: " + question }] }] })
    });
    let data = await res.json();
    let jawab = data.candidates[0].content.parts[0].text;
    ansBox.innerHTML = jawab;
  }catch(e){
    ansBox.innerHTML = "Chabi sahi nahi lagi! Niche wali Chabi check karo.";
  }
}

document.getElementById('aiBtn').onclick = function(){
  if(!qInput.value){ alert("Pehle kuch likho!"); return; }
  aiSePucho(qInput.value);
};
document.getElementById('khojBtn').onclick = function(){
  if(!qInput.value) return;
  window.open("https://www.google.com/search?q=" + qInput.value, "_blank");
};
document.querySelectorAll('.chip').forEach(function(b){
  b.onclick = function(){ qInput.value = b.getAttribute('data-s'); aiSePucho(b.getAttribute('data-s')); }
});

// ===== SABSE NICHE - YAHIN CHABI CHIPKANI HAI =====
const API_KEY = AQ.Ab8RN6I6djIrT0K0LoTF2slrMtyJdP7228K32w9Js7sL8cfwtQ
// ===== SABSE NICHE - YAHIN CHABI CHIPKANI HAI =====

</script>
</body>
</html>
