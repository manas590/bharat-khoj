<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Khoj - Apna Google</title>
<style>
body{margin:0;font-family:Arial;text-align:center;background:white}
.logo{font-size:55px;font-weight:900;margin-top:25px}
.logo span:nth-child(1){color:#4285F4}.logo span:nth-child(2){color:#EA4335}.logo span:nth-child(3){color:#FBBC05}.logo span:nth-child(4){color:#4285F4}.logo span:nth-child(5){color:#34A853}.logo span:nth-child(6){color:#EA4335}.logo span:nth-child(7){color:#4285F4}.logo span:nth-child(8){color:#FBBC05}.logo span:nth-child(9){color:#4285F4}.logo span:nth-child(10){color:#000}
.search{margin:20px 15px;display:flex;align-items:center;border:1px solid #ddd;border-radius:35px;padding:12px 15px;box-shadow:0 3px 12px #ddd;gap:10px}
.search input{flex:1;border:none;outline:none;font-size:18px}
.mic{background:#FF5722;color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:none}
.btns{display:flex;justify-content:center;gap:10px}
.btns button{padding:13px 20px;background:#1A2A6C;color:#fff;border:none;border-radius:12px;font-weight:bold}
.answerBox{margin:15px;text-align:left;background:#E8F5E9;border:2px solid #00A651;border-radius:15px;padding:15px;display:none}
.answerBox b{color:#00A651;font-size:18px}
.savedBox{margin:15px;text-align:left;background:#FFF3E0;border-radius:15px;padding:15px}
.savedBox h3{margin:0 0 10px}
.qItem{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;border:1px solid #ddd}
.qItem b{color:#1A2A6C}
.addBox{margin:15px;background:#F3E5F5;padding:15px;border-radius:15px;text-align:left}
.addBox input{width:95%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
.addBox button{background:#6A1B9A;color:#fff;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;font-size:16px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:15px}
.pill{width:140px;padding:13px;border-radius:25px;color:#fff;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="logo"><span>B</span><span>h</span><span>a</span><span>r</span><span>a</span><span>t</span><span> </span><span>K</span><span>h</span><span>o</span><span>j</span></div>

<div class="search"><span>🔍</span><input id="inp" placeholder="Yaha puchho..."><button class="mic" onclick="startVoice()">🎙️</button></div>
<div class="btns"><button onclick="khoj()">Bharat Khoj Search</button><button onclick="location.href='https://www.google.com/search?q='+document.getElementById('inp').value">Google Pe Dekho</button></div>

<div id="ans" class="answerBox">
<b>✅ Bharat Khoj ka Jawab:</b><br><br>
<span id="ansText"></span><br><br>
<small>Ye jawab pehle kisi ne pucha tha, isliye maine save karke rakha tha!</small>
</div>

<div class="grid">
<a class="pill" href="#" onclick="pucho('Khagaria ka mausam')" style="background:#FF9F00;">☀️ Mausam</a>
<a class="pill" href="#" onclick="pucho('Khagaria mandi bhav')" style="background:#00A651;">🌱 Mandi Bhav</a>
<a class="pill" href="#" onclick="pucho('Aaj sona ka bhav')" style="background:#FFA500;">🪙 Sona Bhav</a>
<a class="pill" href="#" onclick="pucho('Bihar sarkari yojana')" style="background:#1A2A6C;">🏛️ Yojana</a>
</div>

<div class="savedBox">
<h3>🧠 Bharat Khoj ne ab tak <span id="totalQ">0</span> Sawal-Jawab Save kiye!</h3>
<div id="list"></div>
</div>

<h3>➕ Naya
