<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat Khoj</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff;display:flex;flex-direction:column;align-items:center;padding:25px 10px 40px;min-height:100vh}
.logo{font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1}
.logo b:nth-child(1){color:#4285F4}.logo b:nth-child(2){color:#EA4335}.logo b:nth-child(3){color:#FBBC05}.logo b:nth-child(4){color:#4285F4}.logo b:nth-child(5){color:#34A853}.logo b:nth-child(6){color:#EA4335}
.sub{margin:12px 0 20px;color:#333;font-size:15px;text-align:center}
.search-wrap{width:100%;max-width:620px;border:1px solid #dfe1e5;border-radius:28px;display:flex;align-items:center;padding:6px 12px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.search-wrap input{flex:1;border:none;outline:none;font-size:18px;padding:10px}
.mic{font-size:24px;cursor:pointer;padding:5px}
.arrow{font-size:24px;background:#1a73e8;color:#fff;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:5px}
.btns{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.btn{padding:13px 26px;border:none;border-radius:28px;font-weight:700;font-size:17px;color:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.b1{background:#1a73e8}.b2{background:#ea580c}
.counter-box{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.cbox{background:#e8f0fe;padding:12px 18px;border-radius:12px;text-align:center;min-width:130px}
.cbox b{font-size:20px;display:block}
.chips{width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.chip{padding:12px 20px;border-radius:28px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15);font-size:15px}
.c1{background:linear-gradient(135deg,#ff8c00,#ff5e00)}.c2{background:linear-gradient(135deg,#4285f4,#5a95f5)}.c3{background:linear-gradient(135deg,#22c55e,#16a34a)}.c4{background:linear-gradient(135deg,#ef4444,#dc2626)}.c5{background:linear-gradient(135deg,#a855f7,#9333ea)}.c6{background:linear-gradient(135deg,#06b6d4,#0891b2)}.c7{background:linear-gradient(135deg,#facc15,#eab308);color:#000}.c8{background:linear-gradient(135deg,#ec4899,#db2777)}.c9{background:linear-gradient(135deg,#ff0000,#cc0000)}.c10{background:linear-gradient(135deg,#ffd700,#ffb700);color:#000}
#answer{width:100%;max-width:620px;margin-top:20px;background:#f1f3f4;padding:15px;border-radius:12px;display:none;white-space:pre-wrap;line-height:1.6;font-size:16px}
.recent{width:100%;max-width:620px;margin-top:18px}
.recent-item{background:#f1f3f4;padding:7px 13px;border-radius:20px;margin:4px;display:inline-block;cursor:pointer;font-size:14px}
.apps{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:25px;max-width:650px}
.apps div{text-align:center;font-size:13px;cursor:pointer;width:70px}
.apps span{font-size:36px;display:block}
.install{margin-top:25px;background:#111;color:#fff;padding:12px 25px;border-radius:25px;font-weight:700;cursor:pointer}
</style>
</head>

<div class="logo"><b>B</b><b>h</b><b>a</b><b>r</b><b>a</b><b>t</b></div>

<div class="search-wrap">
<input id="q" placeholder="Kuch bhi khojo..." onkeypress="if(event.key==='Enter')khojKaro()">
<span class="mic" onclick="startMic()" title="Bol ke khojo">🎤</span>
<span class="arrow" onclick="khojKaro()">➜</span>
</div>

<div class="btns">
