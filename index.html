function aajKaDate(){ return new Date().toISOString().slice(0,10); }

async function getAajCount(){
  try{ let r = await fetch(FIREBASE_URL+"/daily/"+aajKaDate()+".json").then(x=>x.json());
  return r ? r.count : 0; }catch(e){ return 0; }
}

async function badhaoCount(){
  let c = await getAajCount();
  await fetch(FIREBASE_URL+"/daily/"+aajKaDate()+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({count:c+1})});
}

async function updateBoxes(){
  let aaj = await getAajCount();
  document.getElementById('countBox').innerHTML = `📅 <b>Aaj: ${aaj} / 1500 use hue</b> | Bache: <b>${1500-aaj}</b>`;
}

async function getFromFirebase(q){
  try{
    let r = await fetch(FIREBASE_URL+"/qa.json").then(x=>x.json());
    if(!r) return null;
    for(let k in r){
      if(r[k].q.toLowerCase().trim()===q.toLowerCase().trim()) return r[k];
    }
  }catch(e){}
  return null;
}

  await fetch(FIREBASE_URL+"/qa.json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q:q,a:a,date:aajKaDate()})});
