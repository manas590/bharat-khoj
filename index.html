<!DOCTYPE html>
<html>
<head>
<title>Bharat Khoj</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="text-align:center; font-family:Arial; padding:20px;">
<h1>Bharat Khoj</h1>
<p>Apna Desi Search Engine</p>
<input id="searchBox" type="text" placeholder="Search karo" style="width:90%; padding:10px;">
<br><br>
<button onclick="khojo()" style="padding:10px 20px;">Khojo</button>
<script>
function khojo(){
var q=document.getElementById('searchBox').value;
if(!q){alert("Kuch likho");return;}
window.open("https://www.google.com/search?q="+q,"_blank");
}
</script>
</body>
</html>
