<!-- SAVE + TRENDING SYSTEM START -->
<div style="text-align:center; margin-top:20px;">
<h3>🔥 Log Aaj Kya Puch Rahe Hai</h3>
<div id="trending"></div>
<p style="font-size:13px; color:grey;">Tum jo puchoge wo yaha SAVE ho jayega</p>
</div>

<script>
// Pehle se Khagaria ke famous sawal
let saved = JSON.parse(localStorage.getItem("bharat_search") || '["Khagaria ka mausam","Dhan ka bhav aaj","Khagaria se Patna train","Aaj ki naukri"]');

function showTrending(){
  document.getElementById("trending").innerHTML = saved.map(s=>`<button onclick="document.querySelector('input').value='${s}';document.querySelector('form').submit()" style="margin:4px;padding:8px 14px;border-radius:20px;border:1px solid #ccc;background:white;cursor:pointer;">${s}</button>`).join("");
}
showTrending();

// Jab koi search karega to SAVE ho jayega
document.querySelector("form").addEventListener("submit", function(){
  let q = document.querySelector("input").value;
  if(q && !saved.includes(q)){
    saved.unshift(q);
    saved = saved.slice(0,8);
    localStorage.setItem("bharat_search", JSON.stringify(saved));
  }
});
</script>
<!-- SAVE SYSTEM END -->
