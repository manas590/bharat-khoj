<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat Khoj</title>
<style>
body{font-family:Arial;text-align:center;padding-top:50px;background:#fefefe}
.logo{font-size:50px;font-weight:900} .logo b{color:#ff6f00} .logo i{color:#0a58ca;font-style:normal}
input{width:92%;max-width:520px;padding:16px 20px;border-radius:30px;border:1px solid #ddd;font-size:18px;box-shadow:0 2px 10px #eee}
.btn{margin:15px 5px;padding:12px 28px;border-radius:25px;border:none;color:white;font-size:16px;cursor:pointer}
.blue{background:#0a58ca} .orange{background:#ff6f00} .green{background:green}
.card{text-align:left;max-width:600px;margin:25px auto;padding:15px;border:1px solid #eee;border-radius:12px;background:white}
</style>
</head>
<body>
<div class="logo"><b>भारत</b> <i>Khoj</i></div>
<p>Desi Google - हिंदी में खोजो</p>

<input id="q" type="text" placeholder="जैसे: पटना में सरकारी नौकरी">
<br>
<button class="btn blue" onclick="khoj()">Khoj करो 🔍</button>
<button class="btn orange" onclick="aiKhoj()">AI से पूछो ✨</button>
<br>
<button class="btn green" onclick="saveKaro()">Save Karo 💾</button>

<div id="results"></div>

<script>
function khoj(){
 let qu=document.getElementById('q').value.trim();
 if(!qu){alert('कुछ लिखो पहले!');return;}
 window.open('https://www.google.com/search?q='+encodeURIComponent(qu)+'&hl=hi','_blank');
 document.getElementById('results').innerHTML=`<div class="card"><h3>आपने खोजा: ${qu}</h3><p>✅ Result 1: ${qu} की जानकारी हिंदी में</p><p>✅ Result 2: ${qu} बिहार सरकार योजना</p><p>✅ Result 3: ${qu} पटना में कहाँ मिलेगा</p></div>`;
}
function aiKhoj(){
 let qu=document.getElementById('q').value.trim();
 if(!qu){alert('कुछ लिखो!');return;}
 document.getElementById('results').innerHTML=`<div class="card" style="background:#f0f7ff"><h3>🤖 BharatGPT जवाब</h3><p><b>सवाल:</b> ${qu}</p><p><b>जवाब:</b> ${qu} के बारे में ये जानकारी है। ये भारत का अपना देसी सर्च इंजन है जो जल्द ही भोजपुरी में भी जवाब देगा।</p><a href="https://www.google.com/search?q=${encodeURIComponent(qu)}" target="_blank">Google पर और देखो</a></div>`;
}

// --- Mrb WALA TALA YAHI HAI ---
function saveKaro(){
  var password = prompt("Password Daalo - Sirf Admin");
  if(password !== "Mrb"){
    alert("Galat Password! Save nahi hoga.");
    return;
  }
  var qu = document.getElementById('q').value;
  localStorage.setItem("meraJawab", qu);
  alert("Sahi Password! Save Ho Gaya!");
}
</script>
</body>
</html>
