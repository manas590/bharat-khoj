<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat-Khoj</title>
<style>
body{font-family:Arial;background:#fff;text-align:center;padding:12px;margin:0}
.logo{font-size:62px;font-weight:bold;letter-spacing:-2px;margin:15px 0 5px}
.logo span:nth-child(1){color:#4285F4}.logo span:nth-child(2){color:#EA4335}.logo span:nth-child(3){color:#FBBC05}.logo span:nth-child(4){color:#4285F4}.logo span:nth-child(5){color:#34A853}.logo span:nth-child(6){color:#EA4335}
.sub{color:#555;font-size:14px;margin-bottom:12px}
.search{display:flex;border:1px solid #ccc;border-radius:30px;padding:10px 15px;max-width:520px;margin:10px auto;box-shadow:0 2px 8px #ddd}
.search input{border:none;outline:none;flex:1;font-size:18px}
.mic{border:none;background:none;font-size:24px;cursor:pointer}
.btn{padding:12px 22px;border:none;border-radius:25px;font-size:16px;margin:5px;cursor:pointer}
.blue{background:#4285F4;color:#fff}.orange{background:#FF6D00;color:#fff}
.sec{font-weight:bold;margin:18px 0 8px;text-align:left;max-width:550px;margin-left:auto;margin-right:auto}
.cats{max-width:550px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.cats button{padding:10px 14px;border-radius:20px;border:1px solid #ddd;background:#f1f1f1;cursor:pointer}
.sites{max-width:550px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.sites a{padding:10px 14px;border-radius:20px;border:1px solid #4285F4;background:#e8f0fe;text-decoration:none;color:#000;font-size:14px}
#jawab{text-align:left;max-width:550px;margin:18px auto;background:#e8f0fe;padding:15px;border-radius:12px;white-space:pre-wrap;min-height:60px}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="logo"><span>B</span><span>h</span><span>a</span><span>r</span><span>a</span><span>t</span></div>
<p class="sub">Desi Google - B
