<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat-Khoj</title>
<style>
body{font-family:Arial;background:#fff;text-align:center;padding:15px}
h1{font-size:60px;margin:10px 0 0}
.search{display:flex;border:1px solid #ccc;border-radius:30px;padding:8px 15px;max-width:500px;margin:15px auto}
.search input{border:none;outline:none;flex:1;font-size:18px}
.btn{padding:12px 20px;border:none;border-radius:25px;font-size:16px;margin:5px}
.blue{background:#4285F4;color:#fff}.orange{background:#FF6D00;color:#fff}
.cats{max-width:550px;margin:10px auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.cats button{padding:10px 15px;border-radius:20px;border:1px solid #ddd;background:#f1f1f1}
#jawab{text-align:left;max-width:550px;margin:20px auto;background:#e8f0fe;padding:15px;border-radius:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h1><span style="color:#4285F4">B</span><span style="color:#EA4335">h</span><span style="color:#FBBC05">a</span><span style="color:#4285F4">r</span><span style="color:#34A853">a</span><span style="color:#EA4335">t</span></h1>
<p>Desi Google - Bina Chabi Wala - Ab Hamesha Chalega</p>
<div class="search"><input id="sawal" placeholder="Bharat ka PM kaun hai?"><button onclick="voice()" style="border:none;background:none;font-size:22px">🎙️</button></div>
<button class="btn blue" onclick="pucho()">🔍 Khoj Karo</button>
<button class="btn orange" onclick="pucho()">✨ AI Se Pucho</button>
<div class="cats">
<button onclick="setQ('Bharat ka PM kaun hai')">🇮🇳 PM</button>
<button onclick="setQ('Saif Ali Khan kaun hai')">🎬 Saif Ali Khan</button>
<button onclick="setQ('Bihar ka mukhyamantri kaun hai')">🏛️ Bihar CM</button>
<button onclick="setQ('Cricket')">🏏 Cricket</button>
<button onclick="setQ('Taj Mahal')">🕌 Taj Mahal</button>
<button onclick="setQ('Sarkari Naukri')">💼 Naukri</button>
<button onclick="setQ('Train time table')">🚆 Train</button>
<button onclick="setQ('Mandi bhav')">🧺 Mandi</button>
<button onclick="setQ('Sona ka bhav')">🪙 Sona Bhav</button>
<button onclick="setQ('Rashifal')">🔮 Rashifal</button>
</div>
<div id="jawab">Yahan jawab aayega...</div>
<script>
const DB_URL = "https://bharat-khoj-13d31-default-rtdb.firebaseio.com";
function setQ(t){ document.getElementById('sawal').value=t; pucho(); }
function voice(){ let r = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); r.lang='hi-IN'; r.onresult = function(e){ document.getElementById('sawal').value = e.results[0][0].transcript; pucho(); } r.start(); }
async function pucho(){
  let q = document.getElementById("sawal").value.trim();
  if(!q) return;
  document.getElementById("jawab").innerText = "Soch raha hu...";
  let qLow = q.toLowerCase();
  let id = btoa(unescape(encodeURIComponent(qLow))).replace(/[^a-zA-Z0-9]/g,"_").slice(0,120);
  try{ let r = await fetch(`${DB_URL}/jawab/${id}.json`); let data = await r.json(); if(data && data.text){ document.getElementById("jawab").innerText = "✅ Apne Bhandar se:\n\n" + data.text; return; } }catch(e){}
  try{
    // BINA CHABI WALA - Wikipedia se jawab
    let searchQ = q.replace(/kaun hai|kya hai|kaun|kahan hai/gi,"").trim() || q;
    let res = await fetch(`https://hi.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(searchQ)}`);
    let d = await res.json();
    if(!d.extract){
      res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(searchQ)}`);
      d = await res.json();
    }
    if(d.extract){
      let ans = d.title + "\n\n" + d.extract;
      document.getElementById("jawab").innerText = "🌐 Naya Jawab:\n\n" + ans;
      await fetch(`${DB_URL}/jawab/${id}.json`,{method:"PUT",body:JSON.stringify({text:ans})});
      return;
    }
    // Agar Wikipedia me na mile to DuckDuckGo se
    let res2 = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`);
    let d2 = await res2.json();
    let ans2 = d2.AbstractText || d2.RelatedTopics?.[0]?.Text || "Is bare me abhi jankari nahi mili. Dusra sawal pucho - jaise 'Bharat ka PM kaun hai'";
    document.getElementById("jawab").innerText = "🌐 Naya Jawab:\n\n" + ans2;
    await fetch(`${DB_URL}/jawab/${id}.json`,{method:"PUT",body:JSON.stringify({text:ans2})});
  }catch(e){ document.getElementById("jawab").innerText = "Error: " + e.message + "\n\nDobara try karo bhaiya!"; }
}
</script>
</body>
  </html>
