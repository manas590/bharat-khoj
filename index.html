<!DOCTYPE html>
<html>
<head>
<title>Bharat Khoj</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="text-align:center; font-family:Arial; margin-top:50px;">
<h1>Bharat Khoj</h1>
<p>Apna Desi Search Engine</p>
<input id="searchBox" type="text" placeholder="Yahan likho...">
<br><br>
<button onclick="khojo()" style="padding:10px 20px; background:orange; color:white; border:none; border-radius:5px;">Khojo</button>
<p>👁 total visitors: 1247+</p>
<script>
function khojo(){
var q=document.getElementById('searchBox').value;
if(!q){alert("Kuch likho");return;}
window.open("https://www.google.com/search?q="+q);
fetch('https://api.countapi.xyz/hit/bharat-khoj-manas/visits').then(r=>r.json()).then(d=>{document.getElementById('count').innerText=d.value;});
}
</script>
</body>
</html>
